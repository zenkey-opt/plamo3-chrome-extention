<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>PLaMo 3 Translate</title>
  <link rel="stylesheet" href="../ui/base.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo">訳</span>
      <span class="title">PLaMo 3 Translate</span>
    </div>
    <button id="status" class="status" data-state="checking">
      <span class="dot"></span><span class="label">確認中…</span>
    </button>
    <button id="opts" class="icon" title="設定" aria-label="設定">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M13.1 8.99L14.75 10.19A7.1 7.1 0 0 1 13.28 12.75L11.41 11.92A5.2 5.2 0 0 1 9.69 12.92L9.48 14.94A7.1 7.1 0 0 1 6.52 14.94L6.31 12.92A5.2 5.2 0 0 1 4.59 11.92L2.72 12.75A7.1 7.1 0 0 1 1.25 10.19L2.9 8.99A5.2 5.2 0 0 1 2.9 7.01L1.25 5.81A7.1 7.1 0 0 1 2.72 3.25L4.59 4.08A5.2 5.2 0 0 1 6.31 3.08L6.52 1.06A7.1 7.1 0 0 1 9.48 1.06L9.69 3.08A5.2 5.2 0 0 1 11.41 4.08L13.28 3.25A7.1 7.1 0 0 1 14.75 5.81L13.1 7.01A5.2 5.2 0 0 1 13.1 8.99Z"/><circle cx="8" cy="8" r="2.1"/></svg>
    </button>
  </header>

  <main>
    <section class="panel">
      <div class="langbar">
        <select id="src" aria-label="原文の言語"></select>
        <button id="swap" class="icon" title="言語と文を入れ替え" aria-label="入れ替え">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 5.5h10M10 3l2.5 2.5L10 8M13.5 10.5h-10M6 8l-2.5 2.5L6 13"/></svg>
        </button>
        <select id="tgt" aria-label="訳文の言語"></select>
      </div>
      <textarea id="input" spellcheck="false" placeholder="原文" aria-label="原文"></textarea>
      <div class="divider"></div>
      <div class="out">
        <div id="output" class="output" aria-live="polite"></div>
        <div class="out-tools">
          <span id="meta" class="meta"></span>
          <button id="copy" class="icon" title="訳文をコピー" aria-label="訳文をコピー" disabled>
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5.25" y="5.25" width="8" height="8" rx="1.75"/><path d="M10.75 5.25V3.5A1.75 1.75 0 0 0 9 1.75H3.5A1.75 1.75 0 0 0 1.75 3.5V9A1.75 1.75 0 0 0 3.5 10.75h1.75"/></svg>
          </button>
        </div>
      </div>
    </section>

    <section class="page" id="pageRow">
      <button id="pageBtn" class="primary">このページを翻訳</button>
      <div class="seg" role="group" aria-label="ページ翻訳の表示">
        <button data-mode="replace">置換</button>
        <button data-mode="bilingual">併記</button>
      </div>
    </section>
    <label class="site" id="siteRow" hidden>
      <input type="checkbox" id="siteSkip" />
      <span id="siteSkipText"></span>
    </label>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
