  <h1>週末の散歩コース</h1>
  <p>駅の北口を出て、川沿いの遊歩道を上流に向かって歩きます。春は桜並木が続き、夏は木陰が多いので日差しの強い日でも歩きやすい道です。</p>
  <p>二つ目の橋を渡ったところに小さな公園があり、ベンチと水飲み場があります。ここで少し休んでから、坂道を上って神社に向かいます。</p>
  <p>神社の境内からは町が一望できます。天気のよい日には遠くの山並みまで見えることもあります。帰りは商店街を通って駅に戻ると、全体で一時間半ほどの道のりです。</p>
  <p>途中のパン屋は朝七時から開いていて、焼きたてのパンを買って公園で食べるのもおすすめです。雨の日は遊歩道が滑りやすいので、歩きやすい靴で出かけてください。</p>
</body>
